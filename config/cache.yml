default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

# No separate cache database in production (see config/database.yml). Production uses
# :memory_store (config/environments/production.rb), so Solid Cache is not connected.
production:
  <<: *default
