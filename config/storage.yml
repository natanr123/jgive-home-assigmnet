test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Google Cloud Storage (production). project/bucket come from ENV (defaults match the
# provisioned bucket). Credentials are NOT inlined here — the google gem reads them via
# Application Default Credentials: config/initializers/gcs_credentials.rb materialises the
# service-account key from ENV["GCS_KEYFILE_JSON"] and points GOOGLE_APPLICATION_CREDENTIALS
# at it. Locally you can instead `export GOOGLE_APPLICATION_CREDENTIALS=<path to key>`.
google:
  service: GCS
  project: <%= ENV.fetch("GCS_PROJECT", "npcisland") %>
  bucket: <%= ENV.fetch("GCS_BUCKET", "npcisland-jgive-storage") %>
