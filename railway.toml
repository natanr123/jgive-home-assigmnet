# Railway build config — applies to every service deploying from this repo.
# This app runs as TWO services from the same repo (see README → Deployment):
#   • web    → start: default Dockerfile CMD (Thruster/Puma); healthcheck path: /up
#   • worker → start command override: bundle exec sidekiq   (no healthcheck)
# Both need the same env: RAILS_MASTER_KEY, DATABASE_URL, REDIS_URL, GCS_* (see README).

[build]
builder = "DOCKERFILE"

[deploy]
# Run pending migrations once before a new release goes live (web service).
preDeployCommand = "bin/rails db:prepare"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
